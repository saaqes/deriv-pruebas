<body class="wd-body" data-scene="/dashboard/withdraw/verify">
<script src="assets/sim/js/sim-shared.js?v=20261017zr"></script>
<div class="wd-col">
  <div class="wd-top">
    <button class="wd-iconbtn" id="wdBack" aria-label="Volver"><i class="ic ic-pr_back"></i></button>
    <div class="wd-top-right"><button class="wd-iconbtn" aria-label="Ayuda"><svg class="wd-help" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="9" cy="9" r="7.5"/><path d="M6.9 7.1a2.2 2.2 0 1 1 3.2 2c-.7.4-1.1.8-1.1 1.6" stroke-linecap="round"/><circle cx="9" cy="12.9" r=".5" fill="currentColor"/></svg></button><button class="wd-iconbtn" aria-label="Ask Amy"><i class="ic ic-amy"></i></button></div>
  </div>
  <h1 class="wd-title">Revisa tu teléfono</h1>

  <div class="wd-otp" id="wdOtp">
    <input inputmode="numeric" maxlength="1" autocomplete="one-time-code" aria-label="Dígito 1"><input inputmode="numeric" maxlength="1" aria-label="Dígito 2"><input inputmode="numeric" maxlength="1" aria-label="Dígito 3"><input inputmode="numeric" maxlength="1" aria-label="Dígito 4"><input inputmode="numeric" maxlength="1" aria-label="Dígito 5"><input inputmode="numeric" maxlength="1" aria-label="Dígito 6">
    <span class="wd-otp-spin"></span>
  </div>
  <div class="wd-resend" id="wdResend">¿No recibiste el código? Revisa tu SMS o <button type="button" id="wdResendBtn">reenvía el código</button>.</div>
  <div class="wd-or"><span>o</span></div>
  <button class="wd-outline" id="wdEmail" type="button">Probar otro método de verificación</button>
  <div class="wd-msg" id="wdMsg"></div>
</div>
<div class="wd-loader" id="wdLoader"><div class="wd-ring"><img src="deriv-d-48.png" alt=""></div></div>
